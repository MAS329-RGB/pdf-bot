name: Turbo Academia Max-Speed Publisher

on:
  schedule:
    # تشغيل مزدوج كل 30 دقيقة لإجبار سيرفرات جيت هاب على النشر المستمر
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # تمديد وقت الجولة حتى ساعة ونصف

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Turbo Publisher
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          python fetcher.py

      - name: Commit State & Counter
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json || true
          git diff-index --quiet HEAD || git commit -m "Update state [skip ci]"
          git push
